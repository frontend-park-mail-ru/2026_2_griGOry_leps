{{define "content"}}
<h1 class="auth-title">Восстановление пароля</h1>
<p class="auth-subtitle">
    Укажите email, который использовали при регистрации — пришлём код для сброса пароля
</p>

<form id="forgot-form" novalidate>
    <label class="auth-field">
        <span class="auth-label">Email</span>
        <input type="email" name="email" placeholder="name@mail.ru">
    </label>

    <button type="submit" class="btn btn-primary btn-block">Отправить код</button>

    <p class="auth-footer-hint">
        Вспомнили пароль? <a href="/login">Войти</a>
    </p>
</form>
{{end}}
