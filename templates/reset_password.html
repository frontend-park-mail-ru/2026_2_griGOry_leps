{{define "content"}}
<h1 class="auth-title">Придумайте новый пароль</h1>
<p class="auth-subtitle">
    Мы отправили код на <strong>ivan@mail.ru</strong>
</p>

<form id="reset-form" novalidate>
    <label class="auth-field">
        <span class="auth-label">Код из письма</span>
        <input type="text" name="code" placeholder="6 цифр" inputmode="numeric" maxlength="6">
    </label>

    <label class="auth-field">
        <span class="auth-label">Новый пароль</span>
        <span class="auth-input-wrap">
            <input type="password" name="password" placeholder="Придумайте пароль">
            <button type="button" class="auth-eye" aria-label="Показать пароль" data-toggle-password>
                <img src="/src/img/view_icon.svg" alt="" class="auth-eye-img" aria-hidden="true">
            </button>
        </span>
        <ul class="auth-checklist">
            <li>Минимум 8 символов</li>
            <li>Заглавная и строчная буквы</li>
            <li>Хотя бы одна цифра</li>
        </ul>
    </label>

    <label class="auth-field">
        <span class="auth-label">Повторите пароль</span>
        <span class="auth-input-wrap">
            <input type="password" name="password2" placeholder="Ещё раз пароль">
            <button type="button" class="auth-eye" aria-label="Показать пароль" data-toggle-password>
                <img src="/src/img/view_icon.svg" alt="" class="auth-eye-img" aria-hidden="true">
            </button>
        </span>
    </label>

    <button type="submit" class="btn btn-primary btn-block">Сохранить пароль</button>

    <p class="auth-footer-hint">
        Код не пришёл?
        <a href="#" class="auth-link-inline">Отправить ещё раз через 0:59</a>
    </p>
</form>
{{end}}
