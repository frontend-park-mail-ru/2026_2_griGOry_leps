{{define "content"}}
<h1 class="auth-title">Регистрация в GoGET</h1>
<p class="auth-subtitle">Создайте аккаунт — это займёт меньше минуты</p>

<div class="auth-tabs" role="tablist">
    <a href="/login" class="auth-tab" role="tab">Вход</a>
    <a href="/register" class="auth-tab auth-tab--active" role="tab">Регистрация</a>
</div>

<form id="register-form" novalidate>

    <label class="auth-field">
        <span class="auth-label">Имя</span>
        <input type="text" name="first_name" placeholder="Как к вам обращаться">
        <span class="auth-hint">Видно только вам — в профиле</span>
    </label>

    <label class="auth-field">
        <span class="auth-label">Никнейм</span>
        <input type="text" name="nickname" placeholder="Например, ivan_bike">
        <span class="auth-hint">Его увидят покупатели и продавцы</span>
    </label>

    <label class="auth-field">
        <span class="auth-label">Телефон</span>
        <input type="tel" name="phone" placeholder="+7 900 000-00-00">
        <span class="auth-hint">Покупатели смогут вам позвонить</span>
    </label>

    <label class="auth-field">
        <span class="auth-label">Email</span>
        <input type="email" name="email" placeholder="name@mail.ru">
        <span class="auth-hint">Для связи, если скроете телефон в объявлении</span>
    </label>

    <label class="auth-field">
        <span class="auth-label">Пароль</span>
        <span class="auth-input-wrap">
            <input type="password" name="password" placeholder="Придумайте пароль">
            <button type="button" class="auth-eye" aria-label="Показать пароль" data-toggle-password>
                <img src="/src/img/view_icon.svg" alt="" class="auth-eye-img" aria-hidden="true">
            </button>
        </span>
        <ul class="auth-checklist">
            <li>Минимум 8 символов</li>
            <li>Заглавная и строчная буквы</li>
            <li>Хотя бы одна цифра</li>
        </ul>
    </label>

    <label class="auth-field">
        <span class="auth-label">Повторите пароль</span>
        <span class="auth-input-wrap">
            <input type="password" name="password2" placeholder="Ещё раз пароль">
           <button type="button" class="auth-eye" aria-label="Показать пароль" data-toggle-password>
                <img src="/src/img/view_icon.svg" alt="" class="auth-eye-img" aria-hidden="true">
            </button>
        </span>
    </label>

    <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>

    <p class="auth-legal">
        Нажимая «Зарегистрироваться», вы соглашаетесь с
        <a href="#">условиями использования</a>
    </p>
</form>
{{end}}
