<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>GoGet — нет соединения</title>

		<style>
			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #ffffff;
				color: #141417;
				font-family: Arial, sans-serif;
			}

			.offline {
				width: 100%;
				max-width: 520px;
				padding: 48px 24px;
				text-align: center;
			}

			.offline h1 {
				margin: 0 0 16px;
				font-size: 20px;
				line-height: 28px;
			}

			.offline p {
				margin: 0 0 24px;
				color: #9999a1;
				font-size: 16px;
				line-height: 24px;
			}

			.offline button {
				padding: 12px 24px;
				border: 1px solid #ffa800;
				border-radius: 12px;
				background: #ffa800;
				color: #ffffff;
				font: inherit;
				cursor: pointer;
			}

			.offline button:hover {
				background: #ffffff;
				color: #ffa800;
			}

			.offline button:focus-visible {
				outline: 2px solid #141417;
				outline-offset: 4px;
			}
		</style>
	</head>
	<body>
		<main class="offline">
			<h1>Произошла ошибка при загрузке страницы</h1>
			<p>Проверьте подключение к интернету и попробуйте ещё раз</p>
			<button type="button" onclick="location.reload()">
				Попробовать ещё раз
			</button>
		</main>
	</body>
</html>
